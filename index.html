<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<title>Gym Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#E9E9E7;--surface:#FFFFFF;--ink:#1A1A1A;--muted:#666666;--line:#D0D0CC;--accent:#C62828;--accent-ink:#FFFFFF;--plate:#D5D5D0;--tint:#F0E4E4;--danger:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="dark"]{--bg:#121212;--surface:#1C1C1C;--ink:#EDEDED;--muted:#9A9A9A;--line:#333333;--accent:#EF5350;--accent-ink:#140808;--plate:#CFCFCA;--tint:#2A1C1C;--danger:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
h1,h2,.big,.save,.badge,.tabs button,.chipbig,.userbtn{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
h1{font-size:34px;line-height:1;margin:0;font-weight:700}
h2{font-size:22px;line-height:1.1;margin:0 0 12px;font-weight:700}
.date{color:var(--muted);font-size:14px;margin-top:4px}
.plate{width:44px;height:44px;border-radius:50%;background:var(--plate);display:grid;place-items:center;flex:none}
.plate::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--bg)}
.userbtn{border:0;background:var(--plate);color:#1A1A1A;font-weight:700;font-size:17px;border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tabs button{font-weight:700;font-size:20px;border:0;background:transparent;color:var(--muted);border-radius:9px;min-height:44px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
input{width:100%;font:600 18px Barlow,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips button,.chipbig{font:600 16px Barlow,sans-serif;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chipbig{font-size:22px;font-weight:700;min-height:56px}
.chips button[aria-checked="true"],.chipbig[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:grid;gap:8px}
.ref{background:var(--tint);border-radius:14px;padding:16px 18px;margin-bottom:18px;border-left:6px solid var(--plate)}
.ref h2{margin-bottom:2px}.sub{color:var(--muted);font-size:14px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.gap{margin-top:14px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper button{font:700 22px Barlow,sans-serif;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:48px;cursor:pointer}
.stepper input{text-align:center}
input[type=range]{padding:0;min-height:32px;margin-top:14px;background:none;border:0;accent-color:var(--accent)}
.rng{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.save{width:100%;margin-top:18px;min-height:54px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:22px;cursor:pointer}
.save:disabled{opacity:.6}
.hint{font-size:14px;color:var(--muted);margin-top:8px}.hint b{color:var(--ink);font-weight:600}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1px}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;margin:-4px 0 10px}.summary b{color:var(--ink);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.ref li{border-color:rgba(127,127,127,.25)}
.name{font-weight:600}.detail{color:var(--muted);font-size:14px}
.big{font-weight:700;font-size:22px;white-space:nowrap}
.small-btn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:600 14px Barlow,sans-serif;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer;flex:none}
.hint .small-btn{margin-left:8px}
.empty{color:var(--muted);display:block;padding:4px 0}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;min-height:56px;cursor:pointer;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--muted)}
details[open] summary::after{transform:rotate(180deg)}
summary .l{display:flex;align-items:center;gap:12px;flex:1}
.badge{background:var(--plate);color:#1A1A1A;border-radius:999px;padding:2px 12px;font-weight:700;font-size:16px}
details .body{padding:0 18px 10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-row{display:flex;justify-content:space-between}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 14px Barlow,sans-serif;cursor:pointer;padding:12px 0}
.danger{color:var(--danger)}
.themebtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:7;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="boot"><p class="empty">Loading…</p></main>

<main id="pick" hidden>
  <header><div><h1>Gym Log</h1><div class="date">Who’s lifting?</div></div><div class="plate" aria-hidden="true"></div></header>
  <section class="card">
    <div class="tabs" role="tablist" style="margin-bottom:14px">
      <button role="tab" id="a-in" aria-selected="true" type="button">Sign in</button>
      <button role="tab" id="a-new" aria-selected="false" type="button">Create user</button>
    </div>
    <div id="plwrap"><span class="lbl" id="pl-l">Select user</span><div class="plist" id="plist" role="radiogroup" aria-labelledby="pl-l"></div></div>
    <div id="nwrap" hidden><label for="pname">Name</label><input id="pname" autocomplete="username" autocapitalize="none" autocorrect="off" maxlength="20"></div>
    <div class="gap"><label for="ppw">Password</label><input id="ppw" type="password" autocomplete="current-password"></div>
    <div class="gap" id="cwrap" hidden><label for="ppw2">Confirm password</label><input id="ppw2" type="password" autocomplete="new-password"></div>
    <div class="err" id="aerr" role="alert"></div>
    <button class="save" id="padd" type="button">Sign in</button>
  </section>
</main>

<main id="app" hidden>
  <header>
    <div><h1>Gym Log</h1><div class="date" id="today"></div></div>
    <button class="userbtn" id="who" type="button" aria-label="Sign out"></button>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-log" aria-selected="true" aria-controls="view-log">Log</button>
    <button role="tab" id="tab-hist" aria-selected="false" aria-controls="view-hist">History</button>
  </div>

  <div id="view-log" role="tabpanel" aria-labelledby="tab-log">
    <section class="card">
      <span class="lbl" id="type-l">Today’s workout</span>
      <div class="chips" id="types" role="radiogroup" aria-labelledby="type-l"></div>
    </section>
    <div class="ref" id="ref" aria-live="polite"></div>
    <section class="card" aria-labelledby="add-h">
      <h2 id="add-h">Log an exercise</h2>
      <label for="ex">Exercise</label>
      <input id="ex" placeholder="Bench press" autocomplete="off">
      <div class="hint" id="exhint" aria-live="polite"></div>
      <div class="row">
        <div><label for="sets">Sets</label><input id="sets" type="number" inputmode="numeric" min="1" value="3"></div>
        <div><label for="reps">Reps</label><input id="reps" type="number" inputmode="numeric" min="1" value="10"></div>
      </div>
      <div class="gap">
        <label for="wt">Weight (lb)</label>
        <div class="stepper">
          <button type="button" id="minus" aria-label="Subtract 5 pounds">−5</button>
          <input id="wt" type="number" inputmode="decimal" min="0" step="2.5" value="135">
          <button type="button" id="plus" aria-label="Add 5 pounds">+5</button>
        </div>
        <input type="range" id="wslide" min="0" max="405" step="1" value="135" aria-label="Weight slider, 0 to 405 pounds">
        <div class="rng"><span>0</span><span>405 lb</span></div>
      </div>
      <div class="gap"><label for="rpe">RPE (1–10, optional)</label><input id="rpe" type="number" inputmode="decimal" min="1" max="10" step="0.5" placeholder="8"></div>
      <button class="save" id="save" type="button">Save exercise</button>
    </section>
    <section class="card" aria-labelledby="log-h">
      <h2 id="log-h">Today</h2>
      <div class="summary" id="summary"></div>
      <ul id="list"></ul>
    </section>
  </div>

  <div id="view-hist" role="tabpanel" aria-labelledby="tab-hist" hidden><div id="hist"></div></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-h">
  <h2 id="dlg-h">Edit exercise</h2>
  <label for="e-name">Exercise</label><input id="e-name">
  <div class="row"><div><label for="e-sets">Sets</label><input id="e-sets" type="number" inputmode="numeric" min="1"></div><div><label for="e-reps">Reps</label><input id="e-reps" type="number" inputmode="numeric" min="1"></div></div>
  <div class="row"><div><label for="e-wt">Weight (lb)</label><input id="e-wt" type="number" inputmode="decimal" min="0" step="2.5"></div><div><label for="e-rpe">RPE</label><input id="e-rpe" type="number" inputmode="decimal" min="1" max="10" step="0.5"></div></div>
  <button class="save" id="e-save" type="button">Save changes</button>
  <div class="dlg-row"><button class="link" id="e-cancel" type="button">Cancel</button><button class="link danger" id="e-del" type="button">Delete exercise</button></div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<button class="themebtn" id="themebtn" type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== SETTINGS: paste your two Supabase values here ===== */
const CFG = {
  url: "https://gaelmxyshvgrsmqcatmq.supabase.co",            
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhZWxteHlzaHZncnNtcWNhdG1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MDY4MjMsImV4cCI6MjEwODM4MjgyM30.3_V6kqfaQXmkekR1uJdZgH8qzhBsu2RjJ9W7jEaE7Gg"  // NEVER paste the service_role / secret key
};
/* ========================================================= */
const DOMAIN="gym.stevensalazarjr.com", PFX="gymlog::";
const TYPES=["Push","Pull","Legs","Upper","Lower","Full Body"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=(s,long)=>{const[a,b,c]=s.split("-");return new Date(+a,b-1,+c).toLocaleDateString(undefined,long?{weekday:"long",month:"long",day:"numeric"}:{weekday:"short",month:"short",day:"numeric"})};
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
const line=e=>`${e.sets} × ${e.reps} @ ${e.weight} lb`+(e.rpe?` · RPE ${e.rpe}`:"");
const emailOf=u=>u.toLowerCase()+"@"+DOMAIN;
const COLS="id,name,sets,reps,weight,rpe,created_at";
const NOT_SET="Not connected yet: paste your Supabase URL and key into the SETTINGS block near the bottom of index.html.";
let sb,me=null,uname="",W={},users=[],sel=null,mode="in",tk=iso(new Date()),editing=null,hintE=null,busy=false;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
const fail=e=>toast((e&&e.message)||"Something went wrong");

/* ---------- theme ---------- */
let themeMode="light";try{themeMode=localStorage.getItem("gymlog-mode")||"light"}catch(e){}
function applyMode(m){
  themeMode=m;document.documentElement.setAttribute("data-mode",m);
  const b=$("themebtn");b.textContent=m==="dark"?"☀️":"🌙";
  b.setAttribute("aria-label",m==="dark"?"Switch to light mode":"Switch to dark mode");b.setAttribute("aria-pressed",m==="dark");
  try{localStorage.setItem("gymlog-mode",m)}catch(e){}
}
$("themebtn").onclick=()=>applyMode(themeMode==="dark"?"light":"dark");
applyMode(themeMode==="dark"?"dark":"light");

/* ---------- sign in / create user ---------- */
function setMode(m){
  mode=m;
  $("a-in").setAttribute("aria-selected",m==="in");$("a-new").setAttribute("aria-selected",m==="new");
  $("plwrap").hidden=m!=="in";$("nwrap").hidden=m==="in";$("cwrap").hidden=m==="in";
  $("padd").textContent=m==="in"?"Sign in":"Create user";
  $("aerr").textContent="";$("ppw").value="";$("ppw2").value="";
  $("ppw").autocomplete=m==="in"?"current-password":"new-password";
}
function renderPlist(){
  $("plist").innerHTML=users.length?users.map(u=>`<button type="button" class="chipbig" role="radio" aria-checked="${u===sel}" data-u="${esc(u)}">${esc(u)}</button>`).join(""):'<span class="empty">No users yet. Use Create user.</span>';
}
async function showAuth(){
  me=null;W={};$("boot").hidden=true;$("app").hidden=true;$("pick").hidden=false;
  const{data,error}=await sb.from("profiles").select("username").order("username");
  users=error?[]:data.map(r=>r.username);
  if(!users.includes(sel))sel=users.length===1?users[0]:null;
  setMode(users.length?"in":"new");renderPlist();
}
$("a-in").onclick=()=>setMode("in");
$("a-new").onclick=()=>{setMode("new")};
$("plist").onclick=ev=>{const b=ev.target.closest("[data-u]");if(!b)return;sel=b.dataset.u;$("aerr").textContent="";renderPlist();$("ppw").focus()};
async function submitAuth(){
  if(!sb){$("aerr").textContent=NOT_SET;return}
  if(busy)return;
  const err=m=>{$("aerr").textContent=m},p=$("ppw").value;
  err("");busy=true;$("padd").disabled=true;
  try{
    if(mode==="in"){
      if(!sel){err("Select a user.");return}
      if(!p){err("Enter your password.");return}
      const{error}=await sb.auth.signInWithPassword({email:emailOf(sel),password:PFX+p});
      if(error)err(/invalid/i.test(error.message)?"Wrong password.":error.message);
    }else{
      const n=$("pname").value.trim();
      if(!/^[A-Za-z0-9_]{2,20}$/.test(n)){err("Name: 2–20 letters, numbers or underscores.");return}
      if(!p){err("Enter a password.");return}
      if(p!==$("ppw2").value){err("Passwords don’t match.");return}
      const{data,error}=await sb.auth.signUp({email:emailOf(n),password:PFX+p,options:{data:{username:n}}});
      if(error)err(/registered|exists/i.test(error.message)?"That name is taken.":error.message);
      else if(!data.session)err("Account created, but Supabase still wants email confirmation. Turn it off in Authentication settings.");
    }
  }catch(e){err(e.message)}finally{busy=false;$("padd").disabled=false}
}
$("padd").onclick=submitAuth;
["ppw","ppw2","pname"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth()}));
$("who").onclick=()=>sb.auth.signOut();

/* ---------- load data ---------- */
async function enter(user){
  uname=(user.user_metadata&&user.user_metadata.username)||(user.email||"").split("@")[0];
  const{data,error}=await sb.from("workouts").select("id,day,type,entries("+COLS+")");
  if(error){fail(error);me=null;showAuth();return}
  W={};
  data.forEach(w=>{w.entries.sort((a,b)=>a.created_at<b.created_at?-1:1);W[w.day]={id:w.id,type:w.type,entries:w.entries}});
  tk=iso(new Date());$("today").textContent=fmt(tk,true);$("who").textContent=uname+" · Sign out";
  $("ppw").value="";$("boot").hidden=true;$("pick").hidden=true;$("app").hidden=false;
  $("ex").value="";updateHint();showTab("log");renderAll();
}

/* ---------- rendering ---------- */
const todayW=()=>W[tk];
function lastOfType(t){
  const ks=Object.keys(W).filter(k=>k<tk&&W[k].type===t&&W[k].entries.length).sort();
  return ks.length?ks[ks.length-1]:null;
}
function renderTypes(){
  const cur=todayW()?todayW().type:null;
  $("types").innerHTML=TYPES.map(t=>`<button type="button" role="radio" aria-checked="${t===cur}" data-t="${t}">${t}</button>`).join("");
}
function renderRef(){
  const w=todayW(),r=$("ref");
  if(!w){r.innerHTML='<span class="empty">Pick today’s workout type to see what you did last time.</span>';return}
  const k=lastOfType(w.type);
  if(!k){r.innerHTML=`<h2>Last ${esc(w.type)} day</h2><span class="empty">No earlier ${esc(w.type)} day logged yet.</span>`;return}
  r.innerHTML=`<h2>Last ${esc(w.type)} day</h2><div class="sub">${fmt(k,true)}</div><ul>`+W[k].entries.map(e=>
    `<li><div><div class="name">${esc(e.name)}</div><div class="detail">${line(e)}</div></div><button class="small-btn" data-use="${e.id}" data-k="${k}">Use</button></li>`).join("")+"</ul>";
}
function renderToday(){
  const w=todayW(),list=$("list");
  if(!w||!w.entries.length){list.innerHTML='<li><span class="empty">Nothing logged yet. Save your first exercise above.</span></li>';$("summary").innerHTML="";return}
  let vol=0,n=0;
  list.innerHTML=w.entries.map(e=>{vol+=e.sets*e.reps*e.weight;n+=e.sets;
    return `<li><div><div class="name">${esc(e.name)}</div><div class="detail">${e.sets} × ${e.reps}${e.rpe?" · RPE "+e.rpe:""}</div></div><div class="big">${e.weight} lb</div><button class="small-btn" data-edit="${e.id}" data-k="${tk}" aria-label="Edit ${esc(e.name)}">Edit</button></li>`}).join("");
  $("summary").innerHTML=`<span><b>${esc(w.type)}</b></span><span><b>${w.entries.length}</b> exercises</span><span><b>${n}</b> sets</span><span><b>${Math.round(vol).toLocaleString()}</b> lb volume</span>`;
}
function renderHist(){
  const ks=Object.keys(W).filter(k=>W[k].entries.length).sort().reverse();
  if(!ks.length){$("hist").innerHTML='<section class="card"><span class="empty">No workouts yet. Log one and it will show up here.</span></section>';return}
  const op={};document.querySelectorAll("#hist details[open]").forEach(d=>op[d.dataset.k]=1);
  $("hist").innerHTML=ks.map(k=>`<details data-k="${k}"${op[k]?" open":""}><summary><span class="l"><span>${fmt(k)}</span><span class="badge">${esc(W[k].type)}</span></span></summary><div class="body"><ul>`+
    W[k].entries.map(e=>`<li><div><div class="name">${esc(e.name)}</div><div class="detail">${line(e)}</div></div><button class="small-btn" data-edit="${e.id}" data-k="${k}" aria-label="Edit ${esc(e.name)}">Edit</button></li>`).join("")+"</ul></div></details>").join("");
}
const renderAll=()=>{renderTypes();renderRef();renderToday();renderHist()};
function showTab(t){
  const h=t==="hist";
  $("view-log").hidden=h;$("view-hist").hidden=!h;
  $("tab-log").setAttribute("aria-selected",!h);$("tab-hist").setAttribute("aria-selected",h);
  if(h)renderHist();
}
$("tab-log").onclick=()=>showTab("log");
$("tab-hist").onclick=()=>showTab("hist");

/* ---------- actions ---------- */
$("types").onclick=async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const t=b.dataset.t,w=todayW();
  if(w){
    const{error}=await sb.from("workouts").update({type:t}).eq("id",w.id);
    if(error)return fail(error);w.type=t;
  }else{
    const{data,error}=await sb.from("workouts").insert({user_id:me,day:tk,type:t}).select("id").single();
    if(error)return fail(error);W[tk]={id:data.id,type:t,entries:[]};
  }
  renderAll();
};
const loadInto=e=>{$("ex").value=e.name;$("sets").value=e.sets;$("reps").value=e.reps;$("wt").value=e.weight;$("rpe").value=e.rpe||"";syncW();updateHint()};
$("ref").onclick=ev=>{
  const b=ev.target.closest("[data-use]");if(!b)return;
  const e=W[b.dataset.k].entries.find(x=>x.id===b.dataset.use);
  loadInto(e);toast("Loaded "+e.name+" – adjust and save");$("wt").focus();
};
const syncW=()=>{$("wslide").value=$("wt").value};
const bump=n=>{$("wt").value=Math.max(0,(parseFloat($("wt").value)||0)+n);syncW()};
$("wslide").addEventListener("input",()=>{$("wt").value=$("wslide").value});
$("wt").addEventListener("input",syncW);
$("minus").onclick=()=>bump(-5);$("plus").onclick=()=>bump(5);
function lastOfExercise(name){
  const n=name.trim().toLowerCase();if(!n)return null;let best=null;
  Object.keys(W).sort().forEach(k=>{if(k>=tk)return;W[k].entries.forEach(e=>{if(e.name.trim().toLowerCase()===n)best={k,e,t:W[k].type}})});
  return best;
}
function updateHint(){
  hintE=lastOfExercise($("ex").value);
  $("exhint").innerHTML=hintE?`Last time, ${fmt(hintE.k)} (${esc(hintE.t)}): <b>${line(hintE.e)}</b><button class="small-btn" type="button">Use</button>`:"";
}
$("ex").addEventListener("input",updateHint);
$("exhint").onclick=ev=>{if(ev.target.closest("button")&&hintE){const{e}=hintE;$("sets").value=e.sets;$("reps").value=e.reps;$("wt").value=e.weight;$("rpe").value=e.rpe||"";syncW();$("wt").focus()}};

function readFields(ids){
  const[n,s,r,w,p]=ids.map($);
  const name=n.value.trim(),sets=parseInt(s.value,10),reps=parseInt(r.value,10),weight=parseFloat(w.value),rpe=parseFloat(p.value);
  if(!name||!(sets>0)||!(reps>0)||isNaN(weight)||weight<0)return"Check exercise, sets, reps and weight";
  if(!isNaN(rpe)&&(rpe<1||rpe>10))return"RPE must be between 1 and 10";
  return{name,sets,reps,weight,rpe:isNaN(rpe)?null:rpe};
}
$("save").onclick=async()=>{
  const w=todayW();if(!w)return toast("Pick a workout type first");
  const v=readFields(["ex","sets","reps","wt","rpe"]);if(typeof v==="string")return toast(v);
  $("save").disabled=true;
  const{data,error}=await sb.from("entries").insert({workout_id:w.id,user_id:me,...v}).select(COLS).single();
  $("save").disabled=false;
  if(error)return fail(error);
  w.entries.push(data);renderToday();renderHist();
  toast("Saved "+v.name);$("ex").value="";$("rpe").value="";updateHint();$("ex").focus();
};
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-edit]");if(!b)return;
  const k=b.dataset.k,e=W[k].entries.find(x=>x.id===b.dataset.edit);
  editing={k,id:e.id};
  $("e-name").value=e.name;$("e-sets").value=e.sets;$("e-reps").value=e.reps;$("e-wt").value=e.weight;$("e-rpe").value=e.rpe||"";
  $("dlg-h").textContent="Edit exercise – "+fmt(k);$("dlg").showModal();
});
$("e-cancel").onclick=()=>$("dlg").close();
$("e-save").onclick=async()=>{
  const v=readFields(["e-name","e-sets","e-reps","e-wt","e-rpe"]);if(typeof v==="string")return toast(v);
  const{data,error}=await sb.from("entries").update(v).eq("id",editing.id).select(COLS).single();
  if(error)return fail(error);
  const a=W[editing.k].entries,i=a.findIndex(x=>x.id===editing.id);a[i]=data;
  $("dlg").close();renderAll();updateHint();toast("Changes saved");
};
$("e-del").onclick=async()=>{
  if(!confirm("Delete this exercise?"))return;
  const w=W[editing.k],{error}=await sb.from("entries").delete().eq("id",editing.id);
  if(error)return fail(error);
  w.entries=w.entries.filter(x=>x.id!==editing.id);
  if(!w.entries.length&&editing.k!==tk){await sb.from("workouts").delete().eq("id",w.id);delete W[editing.k]}
  $("dlg").close();renderAll();updateHint();toast("Deleted");
};

/* ---------- start ---------- */
if(CFG.url.startsWith("PASTE")||CFG.key.startsWith("PASTE")){
  $("boot").hidden=true;$("pick").hidden=false;setMode("new");
  $("aerr").textContent=NOT_SET;
}else{
  sb=supabase.createClient(CFG.url,CFG.key);
  sb.auth.onAuthStateChange((ev,s)=>{
    if(s){if(me!==s.user.id){me=s.user.id;setTimeout(()=>enter(s.user),0)}}
    else setTimeout(showAuth,0);
  });
}
</script>
</body>
</html>
